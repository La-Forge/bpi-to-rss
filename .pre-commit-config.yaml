# Pre-commit hooks — run on every commit:
#   - uvx ruff format .   (auto-format, whole repo)
#   - uvx ruff check --fix   (lint + auto-fix safe issues, whole repo)
#   - uvx ty check           (type checker, whole repo)
#
# Install once per clone (activates these hooks):
#   pre-commit install
# Manually run across the whole repo (what CI/commit will see):
#   pre-commit run --all-files

repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: "ruff: uvx ruff format"
        entry: uvx ruff format .
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-check-fix
        name: "ruff: uvx ruff check --fix"
        entry: uvx ruff check --fix .
        language: system
        pass_filenames: false
        always_run: true
      - id: ty-check
        name: "ty: uvx ty check"
        entry: uvx ty check .
        language: system
        pass_filenames: false
        always_run: true
